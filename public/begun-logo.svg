<svg width="200" height="120" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Circuit nodes -->
  <circle cx="90" cy="155" r="5" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="115" cy="140" r="3.5" fill="none" stroke="white" stroke-width="1.5"/>
  <line x1="95" y1="155" x2="115" y2="155" stroke="white" stroke-width="1.5"/>
  <line x1="115" y1="155" x2="115" y2="143" stroke="white" stroke-width="1.5"/>
  <line x1="90" y1="150" x2="90" y2="130" stroke="white" stroke-width="1.5"/>
  <line x1="90" y1="130" x2="130" y2="130" stroke="white" stroke-width="1.5"/>

  <!-- Arc -->
  <path d="M180 230 Q260 120 340 105 Q420 120 500 230" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Car roof -->
  <path d="M240 200 Q290 140 340 130 Q390 140 440 200" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

